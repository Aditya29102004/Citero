  <path d="M380 148 C 330 80, 230 50, 140 100 C 30 160, 0 300, 80 400 C 140 480, 260 500, 360 440" stroke="url(#c-grad)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
